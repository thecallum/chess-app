server {
  listen 80;
  root /usr/share/nginx/html;

  # Pre-rendered routes resolve to their static HTML. Any other path is a
  # client-only route, so serve the SPA fallback shell.
  location / {
    try_files $uri $uri/index.html /__spa-fallback.html;
  }

  # In production the API sits behind the same host or a reverse proxy.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
