# Throwaway stack for end-to-end tests: its own project, ports and database,
# so it runs alongside the dev stack without touching it. Used by
# `pnpm e2e:up` / `pnpm e2e:down` in frontend/, and by CI.
name: chess-e2e

services:
  # Data lives in memory, so every run starts empty and leaves nothing behind.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chessapp
      POSTGRES_PASSWORD: chessapp
      POSTGRES_DB: chessapp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessapp"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The production image, migrating the empty database on startup.
  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Database=chessapp;Username=chessapp;Password=chessapp
    ports:
      - "5081:8080"
    depends_on:
      db:
        condition: service_healthy
