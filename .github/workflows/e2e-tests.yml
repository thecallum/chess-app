name: E2E tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/e2e-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/e2e-tests.yml"

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Browsers are cached per lockfile (so per Playwright version). On a
      # cache hit only the OS packages need installing.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - uses: docker/setup-buildx-action@v3

      # Builds the API image with a GitHub-hosted layer cache. The image is
      # tagged with the name compose would give it (<project>-<service>), so
      # `compose up` below finds it and skips its own build.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: chess-e2e-api
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start API and database
        run: docker compose -f ../docker-compose.e2e.yml up -d --wait

      - name: Run e2e tests
        run: pnpm test:e2e:ci

      - name: Show API logs
        if: failure()
        run: docker compose -f ../docker-compose.e2e.yml logs api

      - name: Stop API and database
        if: always()
        run: docker compose -f ../docker-compose.e2e.yml down

      # Screenshots and traces of failed specs: download from the run summary.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
